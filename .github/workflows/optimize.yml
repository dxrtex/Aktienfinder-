name: Kairo optimieren (Einstieg + Verkauf auswerten)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Lauf-ID von „Kairo-Bilanz (Backtest)“"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: bilanz-[0-9]*
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python -m backend.optimize bilanz_part_*.json
      - uses: actions/upload-artifact@v4
        with:
          name: optimierung
          path: data/optimize.json
