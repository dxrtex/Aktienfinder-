name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Referenz-Trades mit echten Kursen prüfen
        run: python -m aktienfinder.scanner --all --file tickers/beispiele.txt --debug
      - name: Screener-Test (einmalig)
        continue-on-error: true
        run: python tools_probe_screener.py
