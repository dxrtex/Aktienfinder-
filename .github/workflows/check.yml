name: Rückblick einzelne Aktie

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker, z. B. MRNA oder MRNA,UBER"
        required: true
      days:
        description: "Wie viele Handelstage zurück"
        required: false
        default: "120"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.history_check "${{ inputs.tickers }}" --days "${{ inputs.days }}"
