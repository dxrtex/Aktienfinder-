name: Kairo-Bilanz (Backtest)

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.universe
      - run: python -m backend.bilanz --shard ${{ matrix.shard }} --shards 8 --n 1600
      - uses: actions/upload-artifact@v4
        with:
          name: bilanz-${{ matrix.shard }}
          path: bilanz_part_${{ matrix.shard }}.json
  combine:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: bilanz-*
          merge-multiple: true
      - run: python -m backend.bilanz --combine bilanz_part_*.json
      - uses: actions/upload-artifact@v4
        with:
          name: bilanz-ergebnis
          path: data/bilanz_backtest.json
