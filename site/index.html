<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aktienfinder</title>
<meta name="description" content="Tägliche Setups: Rückgang, Fibonacci, RSI-Divergenz, MACD, Momentum Bias Index, Kursziel">
<!-- Als App auf dem Home-Bildschirm -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aktienfinder">
<meta name="theme-color" content="#0d0f13">
<style>
  :root {
    --bg: #0d0f13; --surface: #161a21; --surface-2: #1d222b; --line: #272d38; --text: #e8eaee;
    --muted: #8b94a5; --green: #1fd19b; --green-bg: rgba(31, 209, 155, .12); --red: #ff6159;
    --amber: #f5b544; --amber-bg: rgba(245, 181, 68, .12); --blue: #6b9bff; --zone: rgba(245, 181, 68, .16);
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f6f7f9; --line: #e2e5ea; --text: #161a21;
      --muted: #687082; --green: #059669; --green-bg: rgba(5, 150, 105, .10); --red: #dc3b31;
      --amber: #b7791f; --amber-bg: rgba(183, 121, 31, .10); --blue: #2f5fd0; --zone: rgba(183, 121, 31, .14);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

  /* Kopf */
  header { padding: 20px 0 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .kpis { display: flex; gap: 8px; flex-wrap: wrap; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; text-align: right; }
  .kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 12px; }

  /* Werkzeugleiste */
  .toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line);
             display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  select, input[type=search] { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
                               padding: 7px 10px; font: inherit; font-size: 14px; }
  input[type=search] { flex: 1 1 160px; min-width: 140px; }
  .toolbar label { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

  /* Karten */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; padding: 16px 0 32px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 12px;
          display: flex; flex-direction: column; gap: 10px; }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card-title { min-width: 0; }
  .card-title h2 { margin: 0; font-size: 17px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-title .meta { color: var(--muted); font-size: 13px; }
  .score { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
           font-size: 15px; background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--surface-2) 0); position: relative; }
  .score::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--surface); }
  .score span { position: relative; }
  .figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fig span { display: block; color: var(--muted); font-size: 12px; }
  .fig b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .up { color: var(--green); } .down { color: var(--red); } .muted { color: var(--muted); }
  .spark { width: 100%; height: 78px; display: block; }
  .spark .zone { fill: var(--zone); }
  .spark .lvl { stroke: var(--amber); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
  .spark .price { fill: none; stroke: var(--blue); stroke-width: 1.6; }
  .spark .dot { fill: var(--blue); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .chip.ok { background: var(--green-bg); color: var(--green); border-color: transparent; }
  .chip.star { background: var(--amber-bg); color: var(--amber); border-color: transparent; font-weight: 600; }
  .actions { display: flex; gap: 8px; margin-top: 2px; }
  .btn { flex: 1; text-align: center; border-radius: 10px; padding: 8px 10px; font-size: 14px; font-weight: 600; text-decoration: none;
         border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .details { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  .details ul { margin: 4px 0 0; padding-left: 18px; }

  /* Tabelle */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin: 16px 0 32px; }
  table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; }
  th.sorted::after { content: " ▼"; } th.sorted.asc::after { content: " ▲"; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td a { color: var(--blue); text-decoration: none; }

  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; padding: 0 0 28px; }
  details.src pre { white-space: pre-wrap; font-size: 12px; }
  @media (max-width: 700px) {
    .toolbar { position: static; }
    .toolbar label { flex: 1 1 45%; justify-content: space-between; }
    .toolbar select { flex: 1; }
  }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 24px; } .kpi { padding: 4px 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Aktienfinder</h1>
      <div class="sub" id="sub">Lade Scan …</div>
    </div>
    <div class="kpis" id="kpis"></div>
  </header>

  <div class="toolbar">
    <div class="seg" id="view">
      <button data-v="cards" class="on">Karten</button><button data-v="table">Tabelle</button>
    </div>
    <div class="seg" id="region">
      <button data-r="" class="on">Alle</button><button data-r="us">USA</button><button data-r="europe">Europa</button><button data-r="global">Welt</button>
    </div>
    <label>Kursziel
      <select id="minUpside">
        <option value="-999">alle</option><option value="20">ab +20 %</option>
        <option value="40" selected>ab +40 %</option><option value="60">ab +60 %</option>
      </select>
    </label>
    <label>Börsenwert
      <select id="minCap">
        <option value="0">alle</option><option value="10000000000">ab 10 Mrd. $</option>
        <option value="50000000000">ab 50 Mrd. $</option><option value="200000000000">ab 200 Mrd. $</option>
      </select>
    </label>
    <label>Sortierung
      <select id="sort">
        <option value="score">Score</option><option value="upside">Kursziel</option>
        <option value="fresh">frischestes Signal</option><option value="drawdown">stärkster Rückgang</option>
      </select>
    </label>
    <input type="search" id="search" placeholder="Name oder Ticker suchen">
  </div>

  <main id="main"><div class="empty">Lade Daten …</div></main>

  <details class="src">
    <summary class="muted">Datenquellen &amp; Einstellungen</summary>
    <pre id="sources"></pre>
  </details>
  <footer>Vorfilter für die eigene Chart-Analyse – keine Anlageberatung. Daten: Yahoo Finance (Tageskerzen, Analysten-Kursziele).
    Momentum Bias Index nach AlgoAlpha (MPL 2.0). Scan werktags nach US-Börsenschluss.</footer>
</div>

<script>
const REGION = { us: "USA", europe: "Europa", global: "Welt" };
const TV_EXCHANGE = { DE: "XETR", L: "LSE", PA: "EURONEXT", AS: "EURONEXT", BR: "EURONEXT", LS: "EURONEXT",
  MI: "MIL", MC: "BME", SW: "SIX", ST: "OMXSTO", CO: "OMXCOP", HE: "OMXHEX", OL: "OSL", VI: "VIE",
  IR: "EURONEXT", WA: "GPW", T: "TSE", HK: "HKEX", TO: "TSX", V: "TSXV", AX: "ASX", NS: "NSE", BO: "BSE",
  KS: "KRX", KQ: "KRX", TW: "TWSE", TWO: "TPEX", SI: "SGX", SA: "BMFBOVESPA", MX: "BMV", JO: "JSE", TA: "TASE",
  NZ: "NZX", SS: "SSE", SZ: "SZSE" };

const $ = id => document.getElementById(id);
const fmt = (v, d = 2) => v == null ? "–" : Number(v).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtCap = v => v == null ? "–" : v >= 1e12 ? fmt(v / 1e12, 1) + " Bio. $" : fmt(v / 1e9, v >= 1e10 ? 0 : 1) + " Mrd. $";

function tvUrl(ticker) {
  let sym = ticker, ex = "";
  const m = ticker.match(/^(.+)\.([A-Z]{1,3})$/);
  if (m && TV_EXCHANGE[m[2]]) { sym = m[1]; ex = TV_EXCHANGE[m[2]]; }
  if (ex === "HKEX") sym = String(parseInt(sym, 10));
  sym = sym.replace("-", ".");
  return "https://www.tradingview.com/chart/?symbol=" + encodeURIComponent(ex ? ex + ":" + sym : sym);
}

// ---------- Merkmale einer Aktie (Checkliste auf der Karte) ----------
function traits(r) {
  const kinds = [...new Set(r.divergences.map(d => d.kind))].sort();
  const c = r.cluster || {};
  const rsiNear = r.rsi_signal_gap >= -2 && r.rsi_signal_gap <= 5;
  const fibLabel = r.fib_retracement == null ? "Fib –"
    : r.fib_zone ? `Fib ${fmt(r.fib_retracement, 2)} · Golden Zone`
    : r.fib_retracement > 0.79 ? `Fib ${fmt(r.fib_retracement, 2)} · unter Zone` : `Fib ${fmt(r.fib_retracement, 2)}`;
  return [
    { ok: true, text: `−${fmt(r.pullback_drawdown_pct, 0)} % vom Hoch` },
    { ok: true, star: r.fib_zone, text: fibLabel },
    { ok: true, text: `Divergenz ${kinds.join(" + ")} · vor ${c.divergence_age} T.` },
    { ok: true, star: r.macd_status.startsWith("rot"), text: `MACD ${r.macd_status}` },
    { ok: true, star: r.green_x_count >= 2, text: `MBI ${r.green_x_count}× grünes X` },
    { ok: rsiNear, text: rsiNear ? "RSI an Signallinie" : `RSI ${fmt(r.rsi, 0)}` },
    { ok: r.reversal_candle_age != null, star: r.reversal_candle_age != null,
      text: r.reversal_candle_age != null ? `Umkehrkerze ${r.reversal_candle_age ? "vor " + r.reversal_candle_age + " T." : "heute"}` : "keine Umkehrkerze" },
    { ok: r.ema_breakout_age != null && r.ema_breakout_age < 5,
      text: r.ema_breakout_age == null ? "unter EMA 20" : `über EMA 20 seit ${r.ema_breakout_age} T.` },
    { ok: r.volume_spike || r.volume_breakout, text: r.volume_spike ? "Volumen-Spike am Tief" : r.volume_breakout ? "hohes Volumen" : "Volumen normal" },
  ];
}

// ---------- Mini-Chart mit Golden Zone ----------
function sparkline(r) {
  const p = r.spark || [];
  if (p.length < 2) return "";
  const W = 320, H = 78, pad = 4;
  const hi = r.fib_high, lo = r.fib_low;
  const zone = hi != null && lo != null ? [hi - 0.618 * (hi - lo), hi - 0.79 * (hi - lo)] : null;
  const vals = p.concat(zone ? [zone[0], zone[1], lo] : []);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const x = i => pad + (i / (p.length - 1)) * (W - 2 * pad);
  const y = v => H - pad - ((v - min) / span) * (H - 2 * pad);
  const path = p.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("");
  const zoneSvg = zone ? `<rect class="zone" x="0" width="${W}" y="${y(zone[0]).toFixed(1)}" height="${(y(zone[1]) - y(zone[0])).toFixed(1)}"/>
      <line class="lvl" x1="0" x2="${W}" y1="${y(lo).toFixed(1)}" y2="${y(lo).toFixed(1)}"/>` : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
      aria-label="Kursverlauf der letzten ${p.length} Handelstage, Golden Zone markiert">${zoneSvg}
      <path class="price" d="${path}" vector-effect="non-scaling-stroke"/>
      <circle class="dot" cx="${x(p.length - 1).toFixed(1)}" cy="${y(p[p.length - 1]).toFixed(1)}" r="3"/></svg>`;
}

function detailHtml(r) {
  const c = r.cluster;
  const divs = r.divergences.map(d =>
    `<li>${d.kind}: ${d.prev_pivot_date} (Tief ${fmt(d.prev_price_low)}, RSI ${fmt(d.prev_rsi_low, 1)}) → ${d.pivot_date} (Tief ${fmt(d.price_low)}, RSI ${fmt(d.rsi_low, 1)})</li>`).join("");
  return `Signal-Bündel: Divergenz vor ${c.divergence_age}, MACD vor ${c.macd_age}, grünes X vor ${c.mbi_age} Handelstagen.
    ${r.target_price ? `Ø Kursziel ${fmt(r.target_price)} (${r.analysts ?? "?"} Analysten).` : ""}<ul>${divs}</ul>`;
}

function card(r) {
  const up = r.upside_pct;
  return `<article class="card">
    <div class="card-top">
      <div class="card-title">
        <h2 title="${esc(r.name)}">${esc(r.name || r.ticker)}</h2>
        <div class="meta">${esc(r.ticker)} · ${REGION[r.region] || r.region} · ${fmtCap(r.market_cap_usd)}</div>
      </div>
      <div class="score" style="--p:${r.score}" title="Score"><span>${fmt(r.score, 0)}</span></div>
    </div>
    <div class="figures">
      <div class="fig"><span>Kursziel</span><b class="${up >= 40 ? "up" : "muted"}">${up == null ? "–" : (up > 0 ? "+" : "") + fmt(up, 0) + " %"}</b></div>
      <div class="fig"><span>Kurs</span><b>${fmt(r.close)}</b></div>
      <div class="fig"><span>vom Hoch</span><b class="down">−${fmt(r.drawdown_pct, 0)} %</b></div>
    </div>
    ${sparkline(r)}
    <div class="chips">${traits(r).map(t => `<span class="chip ${t.star ? "star" : t.ok ? "ok" : ""}">${t.ok ? "✓ " : ""}${esc(t.text)}</span>`).join("")}</div>
    <div class="actions">
      <a class="btn primary" href="${tvUrl(r.ticker)}" target="_blank" rel="noopener">Chart öffnen</a>
      <button class="btn" data-t="${esc(r.ticker)}">${open.has(r.ticker) ? "Weniger" : "Details"}</button>
    </div>
    ${open.has(r.ticker) ? `<div class="details">${detailHtml(r)}</div>` : ""}
  </article>`;
}

// ---------- Tabelle ----------
const COLUMNS = [
  { key: "score", label: "Score", num: true, get: r => r.score, html: r => `<b>${fmt(r.score, 0)}</b>` },
  { key: "ticker", label: "Aktie", get: r => r.name || r.ticker,
    html: r => `<a href="${tvUrl(r.ticker)}" target="_blank" rel="noopener">${esc(r.ticker)}</a> <span class="muted">${esc((r.name || "").slice(0, 28))}</span>` },
  { key: "upside", label: "Kursziel", num: true, get: r => r.upside_pct ?? -999,
    html: r => r.upside_pct == null ? "–" : `<span class="${r.upside_pct >= 40 ? "up" : "muted"}">+${fmt(r.upside_pct, 0)} %</span>` },
  { key: "cap", label: "Börsenwert", num: true, get: r => r.market_cap_usd ?? -1, html: r => fmtCap(r.market_cap_usd) },
  { key: "close", label: "Kurs", num: true, get: r => r.close, html: r => fmt(r.close) },
  { key: "dd", label: "vom Hoch", num: true, get: r => r.drawdown_pct, html: r => `<span class="down">−${fmt(r.drawdown_pct, 0)} %</span>` },
  { key: "fib", label: "Fib", num: true, get: r => r.fib_retracement ?? -1, html: r => fmt(r.fib_retracement, 2) + (r.fib_zone ? " ★" : "") },
  { key: "div", label: "Divergenz", get: r => r.cluster.divergence_age,
    html: r => [...new Set(r.divergences.map(d => d.kind))].join(" + ") + ` <span class="muted">vor ${r.cluster.divergence_age} T.</span>` },
  { key: "macd", label: "MACD", get: r => r.macd_status, html: r => esc(r.macd_status) },
  { key: "mbi", label: "MBI", get: r => r.green_x_count, html: r => `${r.green_x_count}× X <span class="muted">vor ${r.cluster.mbi_age} T.</span>` },
  { key: "rsi", label: "RSI", num: true, get: r => r.rsi, html: r => fmt(r.rsi, 0) + (r.rsi_signal_gap >= -2 && r.rsi_signal_gap <= 5 ? " ✓" : "") },
  { key: "rev", label: "Umkehrkerze", get: r => r.reversal_candle_age ?? 99, html: r => r.reversal_candle_age == null ? "–" : `vor ${r.reversal_candle_age} T.` },
];

// ---------- Zustand, Filter, Sortierung ----------
let data = null;
const open = new Set();
const state = { view: "cards", region: "", tableSort: "score", tableAsc: false };

function controls() {
  return { minUpside: +$("minUpside").value, minCap: +$("minCap").value, sort: $("sort").value,
           q: $("search").value.trim().toLowerCase() };
}
const newestAge = r => Math.min(r.cluster.divergence_age, r.cluster.macd_age, r.cluster.mbi_age);
const SORTS = {
  score: (a, b) => b.score - a.score,
  upside: (a, b) => (b.upside_pct ?? -999) - (a.upside_pct ?? -999),
  fresh: (a, b) => newestAge(a) - newestAge(b) || b.score - a.score,
  drawdown: (a, b) => b.pullback_drawdown_pct - a.pullback_drawdown_pct,
};

function filtered() {
  const f = controls();
  return data.results.filter(r => r.passed
      && (!state.region || r.region === state.region)
      && (f.minUpside <= -999 || (r.upside_pct ?? -999) >= f.minUpside)
      && (!f.minCap || (r.market_cap_usd ?? 0) >= f.minCap)
      && (!f.q || r.ticker.toLowerCase().includes(f.q) || (r.name || "").toLowerCase().includes(f.q)));
}

function render() {
  if (!data) return;
  const rows = filtered();
  $("shown").textContent = rows.length.toLocaleString("de-DE");
  if (!rows.length) {
    $("main").innerHTML = `<div class="empty">Keine Setups mit diesen Filtern.<br>Tipp: Kursziel-Filter auf „alle“ stellen.</div>`;
    return;
  }
  if (state.view === "cards") {
    rows.sort(SORTS[controls().sort]);
    $("main").innerHTML = `<div class="grid">${rows.map(card).join("")}</div>`;
    return;
  }
  const col = COLUMNS.find(c => c.key === state.tableSort);
  rows.sort((a, b) => {
    const x = col.get(a), y = col.get(b);
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return state.tableAsc ? c : -c;
  });
  $("main").innerHTML = `<div class="table-wrap"><table><thead><tr>${COLUMNS.map(c =>
      `<th class="${c.num ? "num " : ""}${c.key === state.tableSort ? "sorted" + (state.tableAsc ? " asc" : "") : ""}" data-k="${c.key}">${c.label}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${COLUMNS.map(c => `<td class="${c.num ? "num" : ""}">${c.html(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderHead() {
  const s = data.stats || {};
  const when = new Date(data.generated).toLocaleString("de-DE",
    { weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  $("sub").textContent = `Scan vom ${when} Uhr`;
  const kpi = (v, l, id) => `<div class="kpi"><b${id ? ` id="${id}"` : ""}>${v}</b><span>${l}</span></div>`;
  $("kpis").innerHTML = kpi("–", "angezeigt", "shown") + kpi((s.passed || 0).toLocaleString("de-DE"), "Setups gesamt")
    + kpi((s.liquid || 0).toLocaleString("de-DE"), "Aktien geprüft");
  $("sources").textContent = (data.universe_log || []).join("\n") + "\n\nDauer: " + (data.duration_s || 0) + " s\n\n"
    + Object.entries(data.config || {}).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join("\n");
}

// ---------- Einstellungen merken (nur auf diesem Gerät) ----------
const PREF_KEY = "aktienfinder-v2";
function savePrefs() {
  try {
    const { q, ...c } = controls();
    localStorage.setItem(PREF_KEY, JSON.stringify({ ...c, view: state.view, region: state.region }));
  } catch (e) { /* Speicher nicht verfügbar */ }
}
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
    ["minUpside", "minCap", "sort"].forEach(k => { if (p[k] != null) $(k).value = String(p[k]); });
    if (p.view) state.view = p.view;
    if (p.region != null) state.region = p.region;
  } catch (e) { /* Speicher nicht verfügbar */ }
}
function syncSegs() {
  document.querySelectorAll("#view button").forEach(b => b.classList.toggle("on", b.dataset.v === state.view));
  document.querySelectorAll("#region button").forEach(b => b.classList.toggle("on", b.dataset.r === state.region));
}

$("view").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.view = b.dataset.v; syncSegs(); savePrefs(); render();
});
$("region").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.region = b.dataset.r; syncSegs(); savePrefs(); render();
});
["minUpside", "minCap", "sort", "search"].forEach(id => $(id).addEventListener("input", () => { savePrefs(); render(); }));
$("main").addEventListener("click", e => {
  const th = e.target.closest("th");
  if (th) {
    if (th.dataset.k === state.tableSort) state.tableAsc = !state.tableAsc;
    else { state.tableSort = th.dataset.k; state.tableAsc = false; }
    render(); return;
  }
  const b = e.target.closest("button[data-t]");
  if (b) { const t = b.dataset.t; open.has(t) ? open.delete(t) : open.add(t); render(); }
});

loadPrefs(); syncSegs();
fetch("data/results.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { data = d; renderHead(); render(); })
  .catch(err => { $("main").innerHTML = `<div class="empty">Noch keine Scan-Ergebnisse vorhanden (${esc(err.message)}).</div>`; });
</script>
</body>
</html>
